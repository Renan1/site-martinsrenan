<h1>RM · Renan Martins · Soluções em TI · IA</h1>
<p>Proposta de logo desenhada a partir da referência aprovada. "&gt;" desenvolve, RM executa, o quadrado conecta. Fundo claro usa verde mais escuro para ter contraste; fundo escuro usa o menta #7CFFB0.</p>
<div class="grid">
<figure><img src="logo-claro-separado.svg" alt="Logo em fundo claro"><figcaption>logo-claro-separado.svg (recomendado)</figcaption></figure>
<figure><img src="logo-escuro-separado.svg" alt="Logo em fundo escuro"><figcaption>logo-escuro-separado.svg (recomendado)</figcaption></figure>
<figure><img src="logo-claro-fundido.svg" alt="Alternativa com R e M unidos"><figcaption>logo-claro-fundido.svg (alternativa: perna do R encosta no M)</figcaption></figure>
<figure><img src="logo-escuro-fundido.svg" alt="Alternativa escura"><figcaption>logo-escuro-fundido.svg</figcaption></figure>
<figure><img src="marca-claro.svg" alt="Só símbolo, claro"><figcaption>marca-claro.svg (sem texto, para cabeçalho)</figcaption></figure>
<figure><img src="marca-escuro.svg" alt="Só símbolo, escuro"><figcaption>marca-escuro.svg</figcaption></figure>
</div>
